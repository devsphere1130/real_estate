<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DevSphere Real Estate | Flats, villas, plots and shops for sale and rent</title>
    <meta
      name="description"
      content="DevSphere sells and rents flats, villas, plots, shops and rooms directly. Browse verified listings with carpet area on every property and book a visit this week."
    />
    <meta name="theme-color" content="#0B5D63" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:site_name" content="DevSphere Real Estate" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var t = localStorage.getItem('devsphere-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>DevSphere needs JavaScript to show properties. Please enable it, or WhatsApp us to ask about available properties.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
